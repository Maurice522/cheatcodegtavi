name: Leaks pipeline

on:
  schedule:
    # Every 2 hours — comfortably inside GitHub Actions' free minutes and
    # Gemini's free-tier rate limit (the pipeline already retries on 429/503).
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node src/index.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
